<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="340" height="84" role="img" aria-label="Buka Bookmap">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4aa8ff"/><stop offset="1" stop-color="#28c79a"/></linearGradient>
<filter id="s" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#28c79a" flood-opacity="0.35"/></filter>
</defs>
<style>
text{font-family:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.ring,.ring2{transform-box:fill-box;transform-origin:center}
.ring{animation:ring 2.2s ease-out infinite}
.ring2{animation:ring 2.2s ease-out 1.1s infinite}
.tri{animation:nudge 1.6s ease-in-out infinite}
</style>
<rect x="4" y="6" width="332" height="68" rx="34" fill="url(#g)" filter="url(#s)"/>
<circle class="ring" cx="48" cy="40" r="26" fill="none" stroke="#ffffff" stroke-width="2"/>
<circle class="ring2" cx="48" cy="40" r="26" fill="none" stroke="#ffffff" stroke-width="2"/>
<circle cx="48" cy="40" r="26" fill="#06121f" fill-opacity="0.9"/>
<path class="tri" d="M41 28 L62 40 L41 52 Z" fill="#ffffff"/>
<text x="94" y="38" font-size="24" font-weight="800" fill="#06121f">Buka Bookmap</text>
<text x="94" y="58" font-size="13" font-weight="600" fill="#06121f" fill-opacity="0.72">klik, langsung jalan</text>
</svg>