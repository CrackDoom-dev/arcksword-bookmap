<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcksword Bookmap Free</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Arcksword<span>Bookmap Free</span></div>
    <div id="connectionStatus" class="status status-off">terputus</div>
    <div class="controls">
      <select id="symbolSelect" aria-label="Pasangan">
        <option value="xauusdt">XAUUSDT (emas perpetual, mendekati XAUUSD)</option>
        <option value="paxgusdt">PAXG/USDT (emas fisik)</option>
        <option value="btcusdt">BTC/USDT</option>
        <option value="ethusdt">ETH/USDT</option>
        <option value="solusdt">SOL/USDT</option>
      </select>
      <select id="intervalSelect" aria-label="Timeframe">
        <option>1m</option><option>5m</option><option>15m</option><option>1h</option>
      </select>
      <input id="customSymbol" placeholder="simbol lain, mis. xrpusdt" aria-label="Simbol kustom" />
      <button id="loadSymbol">Muat</button>
    </div>
  </header>

  <section class="calib">
    <input id="mt5Price" type="number" step="0.001" inputmode="decimal" placeholder="Harga di MT5" aria-label="Harga MT5" />
    <select id="brokerDigits" aria-label="Digit broker">
      <option value="2">2 digit</option>
      <option value="3">3 digit</option>
    </select>
    <button id="calibrate" class="primary">Kalibrasi</button>
    <button id="resetOffset">Reset</button>
    <span id="calibInfo" class="calib-info mono">belum dikalibrasi</span>
  </section>

  <section class="stat-grid">
    <div class="stat-card stat-main">
      <span class="stat-label">Harga terakhir</span>
      <span id="statLastPrice" class="stat-value mono">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Spread</span>
      <span id="statSpread" class="stat-value mono">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Volume candle</span>
      <span id="statVolume" class="stat-value mono">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Tekanan beli</span>
      <span id="statBuyPressure" class="stat-value mono">0%</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Latensi</span>
      <span id="statLatency" class="stat-value mono">0 ms</span>
    </div>
  </section>

  <main class="layout">
    <div class="panel area-chart">
      <h2>Heatmap + harga <span id="candleTimer" class="mono"></span></h2>
      <div id="layerChips" class="chips">
        <button data-layer="bubbles">Bubble</button>
        <button data-layer="cob">COB</button>
        <button data-layer="svp">SVP</button>
        <button data-layer="cvd">CVD</button>
      </div>
      <div class="heat-tools">
        <button id="scaleToggle" type="button">Skala: Log</button>
        <button id="microToggle" type="button">Candle: Asli</button>
        <label class="cut">Kontras <input id="cutSlider" type="range" min="0" max="60" step="1" value="0" /><span id="cutValue" class="mono">0%</span></label>
      </div>
      <canvas id="bookmapCanvas"></canvas>
      <div class="legend">
        <span id="legendMin" class="mono">0</span>
        <div id="legendBar" class="legend-bar"></div>
        <span id="legendMax" class="mono">0</span>
      </div>
    </div>
    <div class="panel area-book">
      <h2>Order book</h2>
      <div id="orderBookList"></div>
    </div>
    <div class="panel area-tape">
      <h2>Order eksekusi</h2>
      <div id="tapeList"></div>
    </div>
    <div class="panel area-volume">
      <h2>Volume per candle</h2>
      <div id="volumeList"></div>
    </div>
    <div class="panel area-log">
      <h2>Log order <span class="log-info mono">min 0.5 lot</span></h2>
      <div id="orderLogList"></div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
